name: macos-catalyst

# Mac Catalyst 构建 + sheet 点击延迟 UI 测试。
# 本机（无密码账户）无法初始化 testmanagerd，因此在 GitHub 托管的 macOS
# runner 上跑：那里有正常的测试账户环境，XCUITest 的点击走真实事件管线，
# 能复现"点关闭要几秒"的人工路径。
#
# 调试期每 push 一次就跑一轮，所以做了三层缓存 + 失败要快：
#   - ~/.konan + gradle 依赖：按工具链版本缓存（不缓存时每次要重新下载 2-4 分钟）
#   - .gradle + shared/build：按 shared/ 源码哈希缓存；Swift 改动只 relink（秒级）
#   - DerivedData 滚动缓存：Swift 增量编译
#   - UI 测试 open/close 超时各 15s，打开失败立即返回
# 实测：冷启动约 8-10 分钟；只改 Swift/文档一轮约 3 分 50 秒（构建 ~1 分 50 秒）；
# 改到 Kotlin 源码时多一次 Gradle relink，约 7-8 分钟。

on:
  workflow_dispatch:
  push:
    branches: ["ci/**", "feat/macos-catalyst"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  catalyst-ui-test:
    # xcode-27 预览镜像：macOS 27.0.1 + Xcode 27.2 RC（iOS/macOS 27.2 SDK），
    # 与本机开发环境一致；macos-15 的 Xcode 26.3 没有 iOS 27.1 SDK，构建必失败。
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Select newest Xcode
        run: |
          set -eu
          latest=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          echo "Using $latest"
          sudo xcode-select -s "$latest"
          xcodebuild -version
          xcodebuild -showsdks | grep -E "macosx|iphoneos" || true

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK sanity
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-unset} ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-unset}"
          ls "$HOME/Library/Android/sdk" 2>/dev/null | head -6 || true

      - name: Configure Gradle for CI
        run: |
          mkdir -p "$HOME/.gradle"
          cat >> "$HOME/.gradle/gradle.properties" <<'EOF'
          org.gradle.caching=true
          org.gradle.parallel=true
          org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g
          EOF

      # KMP 编译产物：只改 Swift 时这里命中，gradle 完全不用跑。
      - name: Restore KMP build outputs
        id: kmp-out
        uses: actions/cache/restore@v4
        with:
          path: |
            .gradle
            shared/build
          # rolling key: a cold Gradle link writes a new stamp/framework that
          # has to be saved again, so the key must miss; prefix restore picks
          # the newest entry.
          key: kmp-out-${{ runner.os }}-${{ hashFiles('shared/**/*.kt', 'shared/**/*.kts', 'gradle/libs.versions.toml') }}-${{ github.run_id }}
          restore-keys: |
            kmp-out-${{ runner.os }}-

      # 恢复出来的 stamp 和当前源码哈希一致 → 本次 gradle 不会跑，
      # 也就不必再花 ~35s 解压 1.2G 的 Kotlin/Native 工具链缓存。
      - name: Check Kotlin inputs
        id: kmpcheck
        run: |
          hash=$(scripts/kmp_input_hash.sh "$PWD")
          stamp="shared/build/.kmp-input-stamp-macosarm64-debug"
          fw="shared/build/bin/macosArm64/debugFramework/DeepSeekHarnessShared.framework/Versions/A/DeepSeekHarnessShared"
          echo "hash=$hash" >> "$GITHUB_OUTPUT"
          if [ -f "$stamp" ] && [ "$(cat "$stamp")" = "$hash" ] && [ -f "$fw" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Kotlin inputs unchanged; Kotlin/Native toolchain not needed"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "Kotlin inputs changed or framework missing; toolchain needed"
          fi

      # Kotlin/Native 编译器 + LLVM/sysroot 依赖（~1.5G）与 Gradle 依赖缓存。
      - name: Restore Kotlin/Native + Gradle caches
        id: kmp-toolchain
        if: steps.kmpcheck.outputs.skip != 'true'
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.konan
            ~/.gradle/wrapper/dists
            ~/.gradle/caches/modules-2
            ~/.gradle/caches/build-cache-1
          key: kmp-toolchain-${{ runner.os }}-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties', 'gradle/libs.versions.toml', 'build.gradle.kts') }}
          restore-keys: |
            kmp-toolchain-${{ runner.os }}-

      - name: Install Metal toolchain
        run: |
          # 预览镜像默认不带 Metal Toolchain 组件。xcrun -f metal / metal 壳子
          # 在缺组件时依然"存在"且返回 0，只有真正编一个 .metal 才能判定。
          probe="$RUNNER_TEMP/metal-probe.metal"
          printf 'kernel void dsh_probe() {}\n' > "$probe"
          if xcrun metal -c "$probe" -o "$RUNNER_TEMP/metal-probe.air" >/dev/null 2>&1; then
            echo "Metal toolchain usable"
          else
            echo "Metal toolchain missing; downloading component"
            xcodebuild -downloadComponent MetalToolchain 2>&1 | tail -5
            xcrun metal -c "$probe" -o "$RUNNER_TEMP/metal-probe.air" >/dev/null 2>&1 \
              || { echo "Metal toolchain still unusable"; exit 1; }
            echo "Metal toolchain ready"
          fi

      # 滚动缓存：每次保存一份新的 DerivedData，下次 restore 最近一份。
      # 命中时 xcodebuild 只重编改动过的 Swift 文件（SPM 包也一并复用）。
      - name: Restore DerivedData (rolling)
        id: dd
        uses: actions/cache/restore@v4
        with:
          path: |
            ${{ runner.temp }}/dd/Build
            ${{ runner.temp }}/dd/SourcePackages
          key: dd-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            dd-${{ runner.os }}-

      - name: Build for testing (Mac Catalyst)
        run: |
          xcodebuild \
            -project DeepSeekHarnessMobile.xcodeproj \
            -scheme DeepSeekHarnessMobile \
            -configuration Debug \
            -destination 'platform=macOS,variant=Mac Catalyst' \
            -derivedDataPath "$RUNNER_TEMP/dd" \
            -scmProvider system \
            build-for-testing \
            -showBuildTimingSummary \
            ARCHS=arm64 \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY= \
            CODE_SIGN_ENTITLEMENTS= \
            DEVELOPMENT_TEAM= \
            COMPILER_INDEX_STORE_ENABLE=NO \
            > "$RUNNER_TEMP/build.log" 2>&1 || true
          grep -E "BUILD (SUCCEEDED|FAILED)" "$RUNNER_TEMP/build.log" || true
          if ! grep -q "BUILD SUCCEEDED" "$RUNNER_TEMP/build.log"; then
            echo "==== build errors ===="
            grep -E "error:|fatal error|The following build commands failed" -A3 "$RUNNER_TEMP/build.log" | head -80 || true
            tail -40 "$RUNNER_TEMP/build.log"
            exit 1
          fi
          sed -n '/Build Timing Summary/,/^$/p' "$RUNNER_TEMP/build.log" | head -30 || true

      - name: Ad-hoc sign testable products
        run: |
          set -eu
          APP="$RUNNER_TEMP/dd/Build/Products/Debug-maccatalyst/DshMobile.app"
          RUNNER="$RUNNER_TEMP/dd/Build/Products/Debug-maccatalyst/DeepSeekHarnessMobileUITests-Runner.app"
          [ -d "$APP" ] || { echo "missing $APP"; ls "$RUNNER_TEMP/dd/Build/Products"; exit 1; }
          codesign --force --deep --sign - "$APP"
          if [ -d "$RUNNER" ]; then codesign --force --deep --sign - "$RUNNER"; fi
          codesign --verify --deep "$APP" && echo SIGN_OK

      - name: Run sheet latency UI test
        run: |
          set -uo pipefail
          set +e
          # app 在测试进程之外：实时抓 unified log（TouchTrace/SheetSelfTest）
          log stream --style compact --level debug \
            --predicate 'subsystem == "com.clarklevis.dshmobile"' \
            > "$RUNNER_TEMP/app.log" 2>&1 &
          LOG_PID=$!
          mkdir -p "$RUNNER_TEMP/samples"
          (
            while true; do
              app_pid=$(pgrep -x DshMobile | head -1)
              if [ -n "$app_pid" ]; then
                sudo sample "$app_pid" 2 -file "$RUNNER_TEMP/samples/$app_pid-$(date +%s).txt" >/dev/null 2>&1 || true
              fi
              sleep 2
            done
          ) &
          SAMPLE_PID=$!
          xcodebuild \
            -project DeepSeekHarnessMobile.xcodeproj \
            -scheme DeepSeekHarnessMobile \
            -configuration Debug \
            -destination 'platform=macOS,variant=Mac Catalyst' \
            -derivedDataPath "$RUNNER_TEMP/dd" \
            -scmProvider system \
            -only-testing:DeepSeekHarnessMobileUITests/SheetCloseLatencyUITests \
            test-without-building \
            ARCHS=arm64 \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY= \
            CODE_SIGN_ENTITLEMENTS= \
            DEVELOPMENT_TEAM= \
            > "$RUNNER_TEMP/test.log" 2>&1
          RC=$?
          kill $LOG_PID 2>/dev/null
          kill $SAMPLE_PID 2>/dev/null
          # 只把关键行打到日志里，完整日志进 artifact
          grep -E "METRIC:|Test Case|error:.*failed|TEST (SUCCEEDED|FAILED)|Failed to" \
            "$RUNNER_TEMP/test.log" | head -80 || true
          echo "==== app timeline ===="
          grep -E "TouchTrace|SheetSelfTest|MacSheetClose" "$RUNNER_TEMP/app.log" | tail -60 || true
          if [ "$RC" -ne 0 ]; then
            echo "==== failure context ===="
            grep -E "METRIC: hierarchy" -A60 "$RUNNER_TEMP/test.log" | head -80 || true
          fi
          exit $RC

      - name: Dump app diagnostics timeline
        if: always()
        run: |
          echo "==== TouchTrace / SheetSelfTest / MacSheetClose ===="
          log show --last 20m --style compact \
            --predicate 'subsystem == "com.clarklevis.dshmobile"' 2>/dev/null \
            | grep -E "TouchTrace|SheetSelfTest|MacSheetClose" | tail -300 || echo "(no app log)"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: catalyst-logs
          path: |
            ${{ runner.temp }}/build.log
            ${{ runner.temp }}/test.log
            ${{ runner.temp }}/app.log
            ${{ runner.temp }}/samples
          if-no-files-found: warn

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xcresult
          path: ${{ runner.temp }}/dd/Logs/Test/*.xcresult
          if-no-files-found: warn

      # 诊断期测试本来就会红，缓存必须在失败时也保存，否则永远冷启动。
      - name: Save Kotlin/Native + Gradle caches
        if: always() && steps.kmpcheck.outputs.skip != 'true' && steps.kmp-toolchain.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.konan
            ~/.gradle/wrapper/dists
            ~/.gradle/caches/modules-2
            ~/.gradle/caches/build-cache-1
          key: ${{ steps.kmp-toolchain.outputs.cache-primary-key }}

      - name: Save KMP build outputs
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            .gradle
            shared/build
          key: ${{ steps.kmp-out.outputs.cache-primary-key }}

      # DerivedData 每次都是新 key（run_id），滚动覆盖，总是保存最新一份。
      - name: Save DerivedData (rolling)
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            ${{ runner.temp }}/dd/Build
            ${{ runner.temp }}/dd/SourcePackages
          key: ${{ steps.dd.outputs.cache-primary-key }}
